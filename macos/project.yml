name: CardputerBridge
options:
  bundleIdPrefix: io.nexu.cardputerbridge
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGNING_ALLOWED: NO
    CURRENT_PROJECT_VERSION: 12
    MARKETING_VERSION: 0.10.2
targets:
  CardputerBridgeCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/CardputerBridgeCore
        excludes:
          - "**/* 2.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.nexu.cardputerbridge.core
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
  CardputerBridge:
    type: application
    platform: macOS
    sources:
      - path: Sources/CardputerBridgeApp
        excludes:
          - "**/* 2.swift"
      - path: ../audio-plugin/AudioBridgeSharedMemory.cpp
      - path: ../audio-plugin/AudioBridgeFDBroker.cpp
      - path: Resources
        buildPhase: resources
    dependencies:
      - target: CardputerBridgeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.nexu.cardputerbridge.app
        PRODUCT_NAME: Cardputer Bridge
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        INFOPLIST_KEY_CFBundleDisplayName: Cardputer Bridge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Cardputer Bridge 需要连接 Cardputer，把它用作系统键盘和无线麦克风控制器。
        INFOPLIST_KEY_NSBluetoothPeripheralUsageDescription: Cardputer Bridge 需要通过蓝牙安全配对 Cardputer。
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Cardputer Bridge 使用位置权限读取附近可用的 2.4 GHz Wi-Fi 名称，以便为 Cardputer 配置网络。
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../audio-plugin"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/CardputerBridgeApp/CardputerBridge-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: YES
  CardputerBridgeCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/CardputerBridgeCoreTests
        excludes:
          - "**/* 2.swift"
    dependencies:
      - target: CardputerBridgeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.nexu.cardputerbridge.core-tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CardputerBridge:
    build:
      targets:
        CardputerBridge: all
        CardputerBridgeCoreTests: [test]
    test:
      targets:
        - CardputerBridgeCoreTests
