name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify release contracts
        run: ./scripts/verify-contracts.sh
      - name: Materialize signing keys
        env:
          FIRMWARE_KEY: ${{ secrets.FIRMWARE_SIGNING_KEY_PEM }}
          MANIFEST_KEY: ${{ secrets.RELEASE_MANIFEST_SIGNING_KEY_PEM }}
        run: |
          test -n "$FIRMWARE_KEY"
          test -n "$MANIFEST_KEY"
          mkdir -p firmware/keys .release
          printf '%s\n' "$FIRMWARE_KEY" > firmware/keys/firmware-signing-rsa3072.pem
          printf '%s\n' "$MANIFEST_KEY" > .release/release-manifest-ed25519.pem
          chmod 600 firmware/keys/firmware-signing-rsa3072.pem .release/release-manifest-ed25519.pem
      - name: Build signed firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.2
          target: esp32s3
          path: firmware
          command: >-
            idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.production.defaults"
            -D SDKCONFIG=sdkconfig.production build &&
            idf.py secure-verify-signature --version 2
            --keyfile ../keys/firmware-signing-rsa3072.pem
            cardputer_bridge_firmware.bin
      - name: Create signed manifest
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -Fq "set(PROJECT_VER \"$version\")" firmware/CMakeLists.txt
          published_at="$(date -u -d "@$(git show -s --format=%ct "$GITHUB_SHA")" '+%Y-%m-%dT%H:%M:%SZ')"
          python3 scripts/create-release-manifest.py \
            --version "$version" \
            --build-dir firmware/build \
            --signing-key .release/release-manifest-ed25519.pem \
            --published-at "$published_at" \
            --output .release/cardputer-bridge-release.json
          cp firmware/build/cardputer_bridge_firmware.bin .release/
          cp firmware/build/ota_data_initial.bin .release/
          cp firmware/build/partition_table/partition-table.bin .release/
          cp firmware/build/bootloader/bootloader.bin .release/
      - name: Stage firmware release assets
        uses: actions/upload-artifact@v4
        with:
          name: firmware-release-assets
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
          path: |
            .release/cardputer-bridge-release.json
            .release/cardputer_bridge_firmware.bin
            .release/ota_data_initial.bin
            .release/partition-table.bin
            .release/bootloader.bin

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: brew install xcodegen create-dmg
      - name: Verify macOS app and audio contracts
        run: ./scripts/verify-macos.sh
      - name: Build verified ad-hoc macOS package
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./scripts/build-macos-release.sh --version "$version" --output .release
      - name: Stage macOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-assets
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
          path: |
            .release/Cardputer-Bridge-v*-macOS-arm64.zip
            .release/Cardputer-Bridge-v*-macOS-arm64.sha256
            .release/Cardputer-Bridge-v*-macOS-arm64.dmg
            .release/Cardputer-Bridge-v*-macOS-arm64.dmg.sha256

  manifest-compatibility:
    needs: firmware
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Download generated firmware manifest
        uses: actions/download-artifact@v4
        with:
          name: firmware-release-assets
          path: .release
      - name: Install build tools
        run: brew install xcodegen
      - name: Verify manifest with the production macOS trust path
        run: |
          cd macos
          xcodegen generate --spec project.yml
          CARDPUTER_RELEASE_MANIFEST_PATH="$GITHUB_WORKSPACE/.release/cardputer-bridge-release.json" \
            xcodebuild \
              -project CardputerBridge.xcodeproj \
              -scheme CardputerBridge \
              -configuration Debug \
              -derivedDataPath "$RUNNER_TEMP/manifest-verifier" \
              -destination 'platform=macOS,arch=arm64' \
              CODE_SIGNING_ALLOWED=NO \
              test \
              -only-testing:CardputerBridgeCoreTests/FirmwareUpdateTests/testExternalProductionManifestWhenProvided

  publish:
    needs: [firmware, macos, manifest-compatibility]
    runs-on: ubuntu-latest
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          pattern: '*-release-assets'
          path: .release
          merge-multiple: true
      - name: Stage an atomic draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes_file="$RUNNER_TEMP/cardputer-release-notes.md"
          cat > "$notes_file" <<'EOF'
          下载 `macOS-arm64.dmg`，打开后将 Cardputer Bridge 拖入“应用程序”。固件已包含在本次 Release 中，可由 Mac App 安装或更新。

          macOS App 目前使用 ad-hoc 签名。首次打开或替换为新版本后，请按安装说明在“系统设置 → 隐私与安全性”中选择“仍要打开”。

          使用前请阅读仓库首页的设备、系统与网络要求。
          EOF
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "Cardputer Bridge $GITHUB_REF_NAME" \
              --notes-file "$notes_file"
          fi
          assets=(
            .release/cardputer-bridge-release.json
            .release/cardputer_bridge_firmware.bin
            .release/ota_data_initial.bin
            .release/partition-table.bin
            .release/bootloader.bin
            ".release/Cardputer-Bridge-v${version}-macOS-arm64.zip"
            ".release/Cardputer-Bridge-v${version}-macOS-arm64.sha256"
            ".release/Cardputer-Bridge-v${version}-macOS-arm64.dmg"
            ".release/Cardputer-Bridge-v${version}-macOS-arm64.dmg.sha256"
          )
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
      - name: Verify every asset and publish latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          assets=(
            .release/cardputer-bridge-release.json
            .release/cardputer_bridge_firmware.bin
            .release/ota_data_initial.bin
            .release/partition-table.bin
            .release/bootloader.bin
            ".release/Cardputer-Bridge-v${version}-macOS-arm64.zip"
            ".release/Cardputer-Bridge-v${version}-macOS-arm64.sha256"
            ".release/Cardputer-Bridge-v${version}-macOS-arm64.dmg"
            ".release/Cardputer-Bridge-v${version}-macOS-arm64.dmg.sha256"
          )
          for asset in "${assets[@]}"; do
            test "$(stat -c %s "$asset")" -gt 0
          done
          expected_assets="$(for asset in "${assets[@]}"; do
            printf '%s\t%s\n' "$(basename "$asset")" "$(stat -c %s "$asset")"
          done | LC_ALL=C sort)"
          actual_assets="$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[] | [.name, (.size | tostring)] | @tsv' | LC_ALL=C sort)"
          test "$actual_assets" = "$expected_assets"
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease=false \
            --latest
